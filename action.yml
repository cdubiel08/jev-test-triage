name: jev-test-triage
description: >-
  Mutate the Python lines a pull request changed (and/or read Stryker reports), rank
  surviving mutants and weak tests with TypeSafe Jev, and write a step summary, SARIF,
  and a prompt that a coding agent can act on.
branding:
  icon: filter
  color: purple
inputs:
  typesafe-api-key:
    description: TypeSafe API key (store it as a repository secret). Required unless offline.
    default: ""
  base-ref:
    description: Git ref to diff against. Defaults to the pull request's base branch.
    default: ""
  config:
    description: Path to the jtt config file.
    default: .jtt.toml
  budget:
    description: Maximum Jev spend for this run, in USD.
    default: "0.50"
  fail-on:
    description: "Fail the step when findings reach this bucket: never, act, or review."
    default: never
  pre-command:
    description: Optional command to run first, e.g. an incremental Stryker run that writes mutation.json.
    default: ""
  out-dir:
    description: Where reports are written (relative to working-directory).
    default: .jtt
  reports:
    description: >-
      Space-separated mutation reports to triage instead of mutating changed lines
      (Stryker mutation.json or jtt JSONL), e.g. from your own Stryker step.
    default: ""
  working-directory:
    description: Repository root for jtt (paths in reports are relative to it).
    default: .
  offline:
    description: Replay cached answers only (for testing without a key).
    default: "false"
  cache-dir:
    description: Jev answer cache (relative to working-directory). Defaults to <out-dir>/cache.
    default: ""
outputs:
  act:
    description: Number of surviving mutants judged worth a test.
    value: ${{ steps.jtt.outputs.act }}
  review:
    description: Number of surviving mutants routed to review.
    value: ${{ steps.jtt.outputs.review }}
  weak:
    description: Number of changed tests flagged as weak.
    value: ${{ steps.jtt.outputs.weak }}
  has_findings:
    description: "'true' when there is anything to act on."
    value: ${{ steps.jtt.outputs.has_findings }}
  prompt_file:
    description: Path to the agent prompt (agent-prompt.md).
    value: ${{ steps.jtt.outputs.prompt_file }}
  sarif_file:
    description: Path to the SARIF report.
    value: ${{ inputs.working-directory }}/${{ inputs.out-dir }}/results.sarif
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    - name: Cache Jev answers
      if: inputs.offline != 'true'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.cache-dir || format('{0}/cache', inputs.out-dir) }}
        key: jtt-${{ github.sha }}
        restore-keys: jtt-
    - name: Pre-command
      if: inputs.pre-command != ''
      shell: bash
      run: ${{ inputs.pre-command }}
    - id: jtt
      name: Triage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        BASE: ${{ inputs.base-ref || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
        REPORTS: ${{ inputs.reports }}
        OFFLINE: ${{ inputs.offline }}
        JTT: uvx --from ${{ github.action_path }} jtt
      run: |
        common=(--budget "${{ inputs.budget }}" --fail-on "${{ inputs.fail-on }}" --out-dir "${{ inputs.out-dir }}"
                --cache "${{ inputs.cache-dir || format('{0}/cache', inputs.out-dir) }}")
        if [[ "$OFFLINE" == "true" ]]; then common+=(--offline); else common+=(--require-key); fi
        if [[ -n "$REPORTS" ]]; then
          # shellcheck disable=SC2086
          $JTT triage $REPORTS "${common[@]}"
        else
          git fetch --no-tags --depth=200 origin "${BASE#origin/}" 2>/dev/null || true
          $JTT ci --base "$BASE" --config "${{ inputs.config }}" "${common[@]}"
        fi
